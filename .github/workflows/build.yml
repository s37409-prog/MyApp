name: Build .NET project

on:
  workflow_dispatch:
env:
  DOTNET_VERSION: 10.0.x
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Confirm runner
        shell: bash
        run: echo "Runner is ready"
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}